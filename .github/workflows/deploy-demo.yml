name: Deploy Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-demo.yml"
      - ".firebaserc"
      - "firebase.json"
      - "apps/demo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'plyco-prod' }}

jobs:
  deploy:
    name: Check, build and deploy demo
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check demo
        run: pnpm --filter @plyco/demo typecheck

      - name: Build demo
        run: pnpm --filter @plyco/demo build

      - name: Deploy demo to Firebase Hosting
        uses: w9jds/firebase-action@v15.22.3
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT_JSON }}
          PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
        with:
          args: deploy --only hosting:demo --project ${{ env.FIREBASE_PROJECT_ID }} --non-interactive
